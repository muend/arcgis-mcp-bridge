name: Bug report
description: Report a defect in arcgis-mcp-bridge
title: "[bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Structured error frames make triage fast —
        please paste the full JSON frame if you have one.
  - type: input
    id: arcgis-version
    attributes:
      label: ArcGIS Pro version
      description: Help > About in ArcGIS Pro (e.g. 3.3.1).
      placeholder: "3.3.1"
    validations:
      required: true
  - type: input
    id: tool-name
    attributes:
      label: Target tool name
      description: The MCP tool that misbehaved (e.g. calculate_field, raster_calculator, health_check).
      placeholder: "calculate_field"
    validations:
      required: true
  - type: textarea
    id: error-frame
    attributes:
      label: Structured error JSON frame
      description: |
        The structured error returned to the MCP host, e.g.
        `{"kind": "security", "message": "...", "gp_messages": [...]}`.
        Redact any private paths.
      render: json
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Exact tool call (arguments included) and what you expected instead.
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Bridge interpreter Python version
      placeholder: "3.11.8 (arcgis-mcp-env)"
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant server log excerpt (stderr / ARCGIS_MCP_LOG_FILE)
      render: text
    validations:
      required: false
