name: Bug Report
description: Something is broken or behaving unexpectedly.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before opening an issue, run `health_check` to confirm the
        full server→worker pipeline is reachable.
  - type: dropdown
    id: arcgis-pro-version
    attributes:
      label: ArcGIS Pro version
      options:
        - "3.1"
        - "3.2"
        - "3.3"
        - "3.4"
        - Other (specify in description)
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Python version in arcgis-mcp-env
      placeholder: "3.11.x"
    validations:
      required: true
  - type: input
    id: tool-name
    attributes:
      label: Tool name
      placeholder: "buffer_features"
    validations:
      required: true
  - type: textarea
    id: error-frame
    attributes:
      label: Structured error frame (JSON)
      description: >
        Paste the full JSON error response. If the error is a crash
        with no frame returned, paste the server stderr log instead.
      render: json
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: >
        Exact tool arguments that trigger the issue.
        Redact real paths — replace with placeholder roots.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
