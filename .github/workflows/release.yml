name: release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Build, publish to PyPI, and create the GitHub Release
    runs-on: ubuntu-latest
    
    # PyPI'de tanımladığımız ortam ile eşleşmesi için burayı ekliyoruz
    environment: pypi 
    
    permissions:
      id-token: write  # PyPI'ye şifresiz güvenli bağlanmak için ŞARTTIR
      contents: write  # GitHub Release oluşturabilmek için ŞARTTIR

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: uv build

      - name: Publish to PyPI
        # uv, id-token yetkisini görünce otomatik olarak Trusted Publisher'ı kullanır.
        # Token satırını (UV_PUBLISH_TOKEN) tamamen kaldırıyoruz.
        run: uv publish

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
