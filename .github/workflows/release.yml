name: release

# Publishes to PyPI when a version tag (e.g. v0.6.1) is pushed.
#
# Authentication uses a PyPI API token stored as a GitHub Actions secret.
# One-time setup:
#   1. PyPI -> Account settings -> API tokens -> Add API token
#      (scope it to the `arcgis-mcp-bridge` project now that it exists).
#   2. GitHub -> repo -> Settings -> Secrets and variables -> Actions ->
#      New repository secret -> name: PYPI_API_TOKEN, value: pypi-...
#
# `uv publish --check-url` skips files already present on the index, so
# re-running a tag whose version is already published is a safe no-op.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  pypi-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: uv build

      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: uv publish --check-url https://pypi.org/simple/
