name: release

# On a version tag (e.g. v0.6.0): build, publish to PyPI using OIDC, and cut a GitHub Release.
#
# PyPI authentication utilizes Trusted Publishers (OIDC) instead of static tokens.
# One-time setup required:
#   1. GitHub Repository -> Settings -> Environments -> Create an environment named 'pypi'.
#   2. PyPI -> Account settings -> Portal / Project -> Add GitHub UI Publisher:
#      - Owner: muend
#      - Repository: arcgis-mcp-bridge
#      - Environment: pypi
#      - Workflow: release.yml
#
# `uv publish --check-url` provides a safety net by verifying the package index before publishing.

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Build, publish to PyPI, and create the GitHub Release
    runs-on: ubuntu-latest
    
    # Connects this job to the GitHub Environment for OIDC claim validation
    environment: pypi 
    
    permissions:
      id-token: write  # Critical requirement for requesting the OIDC JWT token
      contents: write  # Required for softprops/action-gh-release to create releases

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Build source distribution and wheel
        run: uv build

      - name: Publish package to PyPI via Trusted Publishing
        # OIDC integration automatically fulfills authentication when id-token is write
        # `--check-url` prevents accidental overwrites or misconfigured index failures
        run: uv publish --check-url https://pypi.org/simple/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*