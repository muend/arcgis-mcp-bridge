name: release

# Publishes to PyPI when a version tag (e.g. v0.6.0) is pushed.
#
# Authentication uses PyPI Trusted Publishing (OIDC) — NO API token or secret
# is stored in the repo. One-time setup on PyPI:
#   PyPI -> your project -> Settings -> Publishing -> Add a pending publisher:
#     Owner:        muend
#     Repository:   arcgis-mcp-bridge
#     Workflow:     release.yml
#     Environment:  pypi
# (For the very first publish, add it as a "pending publisher" before tagging.)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  pypi-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/arcgis-mcp-bridge
    permissions:
      id-token: write  # required for OIDC Trusted Publishing
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
