name: release

# On a version tag (e.g. v0.6.1): build, publish to PyPI, and cut a GitHub Release.
#
# PyPI auth uses an API token stored as a GitHub Actions secret. One-time setup:
#   1. PyPI -> Account settings -> API tokens -> Add API token
#      (scope it to the `arcgis-mcp-bridge` project now that it exists).
#   2. GitHub -> repo -> Settings -> Secrets and variables -> Actions ->
#      New repository secret -> name: PYPI_API_TOKEN, value: pypi-...
#
# `uv publish --check-url` skips files already present on the index, so
# re-running a tag whose version is already published is a safe no-op.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write  # build/publish need read; the GitHub Release step needs write

jobs:
  release:
    name: Build, publish to PyPI, and create the GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: uv build

      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: uv publish --check-url https://pypi.org/simple/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
